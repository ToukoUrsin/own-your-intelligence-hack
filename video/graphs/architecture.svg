<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2E8B57"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2F6FD6"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C77A0A"/></marker>
  </defs>
  <rect width="1920" height="1080" fill="#F7F6F2"/>

  <text x="60" y="92" font-size="44" font-weight="700" fill="#111827">Support that compiles itself</text>
  <text x="60" y="132" font-size="24" fill="#64748B">Every ticket takes the cheapest route that works</text>

  <!-- Customer -->
  <rect x="60" y="470" width="250" height="140" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="185" y="532" text-anchor="middle" font-size="30" font-weight="700" fill="#111827">Customer</text>
  <text x="185" y="568" text-anchor="middle" font-size="30" font-weight="700" fill="#111827">message</text>
  <line x1="310" y1="540" x2="372" y2="540" stroke="#475569" stroke-width="3" marker-end="url(#a)"/>

  <!-- River -->
  <rect x="380" y="420" width="320" height="240" rx="20" fill="#1F2937"/>
  <text x="540" y="478" text-anchor="middle" font-size="40" font-weight="700" fill="#FFFFFF">River</text>
  <text x="540" y="516" text-anchor="middle" font-size="22" fill="#CBD5E1">fine-tuned router</text>
  <text x="540" y="560" text-anchor="middle" font-size="22" fill="#CBD5E1">standardized request</text>
  <rect x="440" y="584" width="200" height="46" rx="23" fill="#374151"/>
  <text x="540" y="615" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">77% held-out</text>

  <!-- fork -->
  <path d="M700,540 C745,540 740,300 780,300" fill="none" stroke="#2E8B57" stroke-width="3" marker-end="url(#ag)"/>
  <path d="M700,540 L780,540" fill="none" stroke="#2F6FD6" stroke-width="3" marker-end="url(#ab)"/>
  <path d="M700,540 C745,540 740,805 780,805" fill="none" stroke="#C77A0A" stroke-width="3" marker-end="url(#aa)"/>

  <!-- COMPILED lane -->
  <rect x="785" y="195" width="930" height="170" rx="20" fill="#E8F5EE" stroke="#2E8B57" stroke-width="2"/>
  <text x="815" y="232" font-size="24" font-weight="700" letter-spacing="3" fill="#2E8B57">COMPILED</text>
  <rect x="1500" y="210" width="195" height="36" rx="18" fill="#2E8B57"/>
  <text x="1597" y="235" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">0 model calls</text>
  <rect x="815" y="258" width="280" height="90" rx="14" fill="#FFFFFF" stroke="#2E8B57" stroke-width="2"/>
  <text x="955" y="296" text-anchor="middle" font-size="28" font-weight="700" fill="#111827">JSON plan</text>
  <text x="955" y="328" text-anchor="middle" font-size="20" fill="#475569">deterministic</text>
  <line x1="1095" y1="303" x2="1163" y2="303" stroke="#2E8B57" stroke-width="3" marker-end="url(#ag)"/>
  <rect x="1170" y="258" width="220" height="90" rx="14" fill="#FFFFFF" stroke="#2E8B57" stroke-width="2"/>
  <text x="1280" y="313" text-anchor="middle" font-size="28" font-weight="700" fill="#111827">Tools</text>
  <line x1="1390" y1="303" x2="1458" y2="303" stroke="#2E8B57" stroke-width="3" marker-end="url(#ag)"/>
  <rect x="1465" y="258" width="230" height="90" rx="14" fill="#FFFFFF" stroke="#2E8B57" stroke-width="2"/>
  <text x="1580" y="313" text-anchor="middle" font-size="28" font-weight="700" fill="#111827">Reply</text>

