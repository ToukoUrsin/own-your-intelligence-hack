  <text x="1810" y="434" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">reused ≥3×</text>
  <text x="1810" y="464" text-anchor="middle" font-size="17" fill="#475569">+ shadow-matches</text>
  <text x="1810" y="492" text-anchor="middle" font-size="17" fill="#475569">the agent</text>
  <rect x="1728" y="246" width="164" height="54" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
  <text x="1810" y="280" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">compiled plan</text>

  <text x="960" y="1030" text-anchor="middle" font-size="22" fill="#64748B">Support AGI · Northwind Outfitters demo · QM · GBrain · Memorable · River</text>
</svg>
