  <text x="815" y="477" font-size="24" font-weight="700" letter-spacing="3" fill="#2F6FD6">RECALLED</text>
  <rect x="815" y="503" width="280" height="90" rx="14" fill="#FFFFFF" stroke="#2F6FD6" stroke-width="2"/>
  <text x="955" y="541" text-anchor="middle" font-size="28" font-weight="700" fill="#111827">Memorable</text>
  <text x="955" y="573" text-anchor="middle" font-size="20" fill="#475569">learned path</text>
  <line x1="1095" y1="548" x2="1163" y2="548" stroke="#2F6FD6" stroke-width="3" marker-end="url(#ab)"/>
  <rect x="1170" y="503" width="280" height="90" rx="14" fill="#FFFFFF" stroke="#2F6FD6" stroke-width="2"/>
  <text x="1310" y="541" text-anchor="middle" font-size="28" font-weight="700" fill="#111827">QM agent</text>
  <text x="1310" y="573" text-anchor="middle" font-size="20" fill="#475569">Claude, low effort</text>
  <line x1="1450" y1="548" x2="1508" y2="548" stroke="#2F6FD6" stroke-width="3" marker-end="url(#ab)"/>
  <rect x="1515" y="503" width="180" height="90" rx="14" fill="#FFFFFF" stroke="#2F6FD6" stroke-width="2"/>
  <text x="1605" y="558" text-anchor="middle" font-size="28" font-weight="700" fill="#111827">Reply</text>

  <!-- EXPLORED lane -->
  <rect x="785" y="690" width="930" height="220" rx="20" fill="#FCF3E3" stroke="#C77A0A" stroke-width="2"/>
  <text x="815" y="727" font-size="24" font-weight="700" letter-spacing="3" fill="#C77A0A">EXPLORED</text>
  <rect x="815" y="760" width="210" height="90" rx="14" fill="#FFFFFF" stroke="#C77A0A" stroke-width="2"/>
  <text x="920" y="798" text-anchor="middle" font-size="28" font-weight="700" fill="#111827">QM agent</text>
  <text x="920" y="830" text-anchor="middle" font-size="20" fill="#475569">Claude</text>
  <line x1="1025" y1="805" x2="1063" y2="805" stroke="#C77A0A" stroke-width="3" marker-end="url(#aa)"/>
  <text x="1049" y="790" text-anchor="middle" font-size="16" fill="#8A5A10"></text>
  <rect x="1070" y="742" width="400" height="150" rx="16" fill="none" stroke="#C77A0A" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="1270" y="768" text-anchor="middle" font-size="18" fill="#8A5A10">explores with</text>
  <rect x="1085" y="782" width="190" height="96" rx="14" fill="#FFFFFF" stroke="#C77A0A" stroke-width="2"/>
  <text x="1180" y="823" text-anchor="middle" font-size="28" font-weight="700" fill="#111827">GBrain</text>
  <text x="1180" y="855" text-anchor="middle" font-size="18" fill="#475569">company knowledge</text>
  <rect x="1290" y="782" width="165" height="96" rx="14" fill="#FFFFFF" stroke="#C77A0A" stroke-width="2"/>
  <text x="1372" y="823" text-anchor="middle" font-size="28" font-weight="700" fill="#111827">Shopify</text>
  <text x="1372" y="855" text-anchor="middle" font-size="18" fill="#475569">tools</text>
  <line x1="1470" y1="817" x2="1503" y2="817" stroke="#C77A0A" stroke-width="3" marker-end="url(#aa)"/>
  <rect x="1510" y="772" width="195" height="90" rx="14" fill="#FFFFFF" stroke="#C77A0A" stroke-width="2"/>
  <text x="1607" y="810" text-anchor="middle" font-size="26" font-weight="700" fill="#111827">Memorable</text>
  <text x="1607" y="842" text-anchor="middle" font-size="19" fill="#475569">saves the path</text>

  <!-- feedback loop -->
  <path d="M1705,817 L1790,817 Q1810,817 1810,797 L1810,178 Q1810,160 1790,160 L1070,160 Q1050,160 1050,180 L1050,250" fill="none" stroke="#475569" stroke-width="3" stroke-dasharray="10 7" marker-end="url(#a)"/>
  <rect x="1728" y="610" width="164" height="54" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
  <text x="1810" y="644" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">saved path</text>
